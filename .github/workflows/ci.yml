name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Test 
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Run tests
        run: go test -race -cover ./...
      
      - name: Install gosec
        # pinned: v2.27.0+ requires Go 1.25.8, but go.mod targets 1.25.5.
        # v2.26.0 is the newest gosec that builds on 1.25.5.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.26.0
      
      - name: Run gosec 
        run: gosec -severity=medium -exclude-generated ./...
  
  style:
    name: Style
    runs-on: ubuntu-latest 

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go 
        uses: actions/setup-go@v5 
        with:
          go-version-file: go.mod 
          cache: true
      
      - name: Format checking
        run: test -z $(go fmt ./...)
      
      - name: Install Staticcheck
        # pinned: v0.8.0 requires Go 1.26.0, but go.mod targets 1.25.5.
        # v0.7.0 is the newest staticcheck that builds on 1.25.5.
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run Staticcheck
        run: staticcheck ./...

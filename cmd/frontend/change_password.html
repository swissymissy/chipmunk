<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chipmunk - Change Password</title>
    <link rel="icon" type="image/png" href="/images/chipmunk.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="logo-header">
            <img src="/images/chipmunk.png" alt="Chipmunk logo" class="logo">
            <h1>Chipmunk</h1>
    </div>
    <h2>Change your password</h2>
    <p>Your password was reset. Please set a new one to continue.</p>

    <div id="error-msg"></div>

    <form id="change-form">
        <label for="current-password">Current password</label>
        <input type="password" id="current-password" required autofocus>

        <label for="new-password">New password</label>
        <input type="password" id="new-password" required>

        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" required>

        <button type="submit">Save new password</button>
    </form>

    <p><a class="secondary-link" href="/student_login.html" onclick="clearStudentAuth()">Log out</a></p>

    <script src="/js/api.js"></script>
    <script src="/js/change_password.js"></script>
</body>
</html>
